# Tests and builds every pull request, every push to main, and on demand: the Jest tests, the Android .apk
# (ubuntu-latest) and the iOS simulator .app (macos-latest) side by side, then every screen on an Android emulator,
# light and dark.
#
# One run tells every failure: the builds do not wait for the tests, each check step runs even when an earlier check
# failed, and the screenshot walk reports every miss before it fails once at the end. Results are uploaded on failure.
#
# Every action is named by its commit, not by a tag someone can move. The version each SHA was on 2026-11-03 is in the
# comment beside it. To update one, look up the new version's commit, read what changed, and change both.
name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - id: install
        run: npm ci
      # each check runs whatever the one before it did, as long as the install worked
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Jest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test -- --ci
      - name: expo-doctor
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx --yes expo-doctor@1.21.6
      - name: The screenshot walk names a state for every spec id
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/screenshots.mjs --plan

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      # Continuous Native Generation: android/ is made here from app.json and plugins/, never committed.
      - run: npx expo prebuild --platform android --clean --no-install
      # Release build type, signed with the debug keystore as Expo's template does: the JS bundle is inside.
      - run: ./gradlew assembleRelease --no-daemon --max-workers=3
        working-directory: android
      - name: Check the bundle is inside, and name the APK
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$apk" | grep -q 'assets/index.android.bundle'
          mkdir -p dist
          cp "$apk" dist/mossgrove-react-native-ci-debug.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mossgrove-react-native-apk
          path: dist/mossgrove-react-native-ci-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      # Expo SDK 58 needs a newer Swift than Xcode 26.2's (ExpoModulesJSI fails to compile there), so take the newest
      # stable Xcode the runner has, whatever its default is.
      - name: Use the newest stable Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - run: npm ci
      # ios/ is made here (with pod install), never committed.
      - run: npx expo prebuild --platform ios --clean
      - run: scripts/build-ios-simulator.sh ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mossgrove-react-native-simulator
          path: dist/mossgrove-react-native-ci-simulator.zip
          if-no-files-found: error
          retention-days: 14

  # Every screen, light and dark, on an Android emulator on GitHub's machine, with round one's file names. The same
  # walk reads UiAutomator's tree (what Appium's UiAutomator2 driver reads) in every state the spec names, reports each
  # spec id seen as resource-id or why not, and taps Sign in, Clear search, Join and Check balance with the keyboard
  # up. It fails once, at the end, if anything was missed. The pictures are an artifact; docs/screenshots/ changes
  # only when someone commits them.
  screenshots:
    needs: android
    runs-on: ubuntu-latest
    # the walk reads the tree in 29 states per theme, from 11 cold starts each: about twice the first walk's work. It
    # starts no segment after 50 minutes and waits at most 5 for a lost device, so its reports are written before this.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mossgrove-react-native-apk
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The one third-party action: it starts an emulator, runs the script, and shuts the emulator down.
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          # the runner has 4 cores and 16 GB; the action's default is 2 cores and the profile's RAM. Run 41740214045
          # lost the emulator 1 minute into the walk, and an emulator starved on API 35 is the likeliest cause.
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # The smoke start runs once after the install: it starts the app, waits 60 s for its sign-in screen and says
          # what is on screen either way. If the app does not start it says so in one line (an error annotation) and
          # the walk, which reads its smoke.json, writes its reports without running and fails. "|| true" only lets the
          # walk's line run to write them: the walk fails the step.
          script: |
            adb -s emulator-5554 install -r dist/mossgrove-react-native-ci-debug.apk
            node scripts/screenshots.mjs --smoke || true
            node scripts/screenshots.mjs
      - name: The walk and the ids, in the job summary
        if: ${{ !cancelled() }}
        run: cat build/screenshots/walk.md build/screenshots/android-ids.md >> "$GITHUB_STEP_SUMMARY" || true
      # the pictures, every state's tree, the reports and, for a segment that stopped, its screen and tree (and, for a
      # lost device, what the guest logged once it was back)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mossgrove-react-native-screenshots
          path: build/screenshots/
          if-no-files-found: error
          retention-days: 30
