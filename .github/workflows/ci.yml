# Every check. build.yml and release.yml call this workflow; it never runs on its own.
#
#   the fast checks, on every run     test: typecheck, Jest, expo-doctor, Expo's versions, the walk's plan (ubuntu)
#                                     android: the release-built, debug-signed .apk (ubuntu)
#                                     ios: the zipped simulator .app (macos: only a Mac builds for the iOS Simulator)
#   the device suite, when asked      screenshots: every screen, light and dark, on an Android emulator, with the ids
#   (`devices: true`)                 in UiAutomator's tree, the keyboard-up taps, and the Lobby's tree order
#   always, last                      summary: every check in a table; it fails the run when any check failed or was
#                                     cancelled, and lists a skipped one as skipped
#
# build.yml asks for the device suite on "Run workflow" and on the monthly schedule; release.yml always does. On a push
# or a pull request the screenshots job is skipped: no emulator starts.
#
# One run tells every failure: the builds do not wait for the tests, each check step runs even when an earlier check
# failed, and the screenshot walk reports every miss before it fails once at the end. Results are uploaded on failure.
#
# Each job is already one part that can fail on its own, so "Re-run failed jobs" re-runs only what failed (and the
# summary). The checks in `test` stay together: each takes under a minute and all share one npm install. The walk in
# `screenshots` stays one job: it is one script on one emulator, and its id table counts an id only when both themes
# saw it. There are no retries anywhere: a flaky check is re-run by a person.
#
# Cached, under keys made of what they hold: npm's downloads (actions/setup-node, package-lock.json), Gradle's folders
# (gradle/actions/setup-gradle's own keys), and CocoaPods' downloads and specs, keyed on what expo prebuild makes the
# Podfile from (package-lock.json, app.json, plugins/). Only runs on main write a cache; a pull request reads it.
#
# Every action is named by its commit, not by a tag someone can move. The version each SHA was on 2026-11-03 is in the
# comment beside it (actions/cache: 2026-11-04). To update one, look up the new version's commit, read what changed,
# and change both.
name: ci

on:
  workflow_call:
    inputs:
      version:
        description: What the .apk and the zip are named after, mossgrove-react-native-<version>-debug.apk (the tag, or build-<run number>)
        type: string
        required: true
      devices:
        description: Run the device suite on an Android emulator as well
        type: boolean
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      typecheck: ${{ steps.typecheck.outcome }}
      jest: ${{ steps.jest.outcome }}
      doctor: ${{ steps.doctor.outcome }}
      versions: ${{ steps.versions.outcome }}
      plan: ${{ steps.plan.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: "22"
          cache: npm
      - id: install
        timeout-minutes: 10
        run: npm ci
      # each check runs whatever the one before it did, as long as the install worked
      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        run: npm run typecheck
      - name: Jest
        id: jest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 10
        run: npm test -- --ci
      # The doctor's version check asks Expo's servers what each SDK package should be on the day it runs, so an Expo
      # patch release turned a push that changed nothing red (run 44312162058). The doctor's own setting switches that
      # one check off here; every other doctor check still fails the build. The next step runs the same check itself.
      - name: expo-doctor
        id: doctor
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: "1"
        run: npx --yes expo-doctor@1.21.6
      # The doctor's version check: a newer Expo patch release is a warning on the run (fix it with
      # `npx expo install --fix`); a major or minor drift, a missing package or a check that cannot run fails it.
      - name: Expo versions (a patch release only warns)
        id: versions
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 5
        run: node scripts/expo-versions.mjs
      - name: The screenshot walk names a state for every spec id
        id: plan
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 2
        run: node scripts/screenshots.mjs --plan

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      apk: ${{ steps.apk.outcome }}
      bundle: ${{ steps.bundle.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        timeout-minutes: 5
        with:
          distribution: temurin
          java-version: "21"
      # Caches Gradle's folders (the wrapper, the dependencies, the build cache) under Gradle's own keys.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        timeout-minutes: 10
      - timeout-minutes: 10
        run: npm ci
      # Continuous Native Generation: android/ is made here from app.json and plugins/, never committed.
      - timeout-minutes: 10
        run: npx expo prebuild --platform android --clean --no-install
      # Release build type, signed with the debug keystore as Expo's template does: the JS bundle is inside.
      - id: apk
        timeout-minutes: 45
        run: ./gradlew assembleRelease --no-daemon --max-workers=3
        working-directory: android
      - name: Check the bundle is inside, and name the APK after the version
        id: bundle
        timeout-minutes: 2
        env:
          VERSION: ${{ inputs.version }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          unzip -l "$apk" | grep -q 'assets/index.android.bundle'
          mkdir -p dist
          cp "$apk" "dist/mossgrove-react-native-${VERSION}-debug.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: mossgrove-react-native-apk
          path: dist/mossgrove-react-native-${{ inputs.version }}-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    outputs:
      app: ${{ steps.app.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: "22"
          cache: npm
      # Expo SDK 58 needs a newer Swift than Xcode 26.2's (ExpoModulesJSI fails to compile there), so take the newest
      # stable Xcode the runner has, whatever its default is.
      - name: Use the newest stable Xcode
        timeout-minutes: 2
        run: |
          xcode="$(printf '%s\n' /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - timeout-minutes: 10
        run: npm ci
      # CocoaPods' downloads (the pods' sources and React Native's prebuilt archives) and its specs. expo prebuild makes
      # the Podfile from package-lock.json's packages, app.json and plugins/, so those are the key.
      - name: Cache CocoaPods
        timeout-minutes: 5
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: pods-${{ runner.os }}-${{ hashFiles('package-lock.json', 'app.json', 'plugins/**') }}
          restore-keys: |
            pods-${{ runner.os }}-
      # ios/ is made here (with pod install), never committed.
      - timeout-minutes: 15
        run: npx expo prebuild --platform ios --clean
      - id: app
        timeout-minutes: 60
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/build-ios-simulator.sh "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: mossgrove-react-native-simulator
          path: dist/mossgrove-react-native-${{ inputs.version }}-simulator.zip
          if-no-files-found: error
          retention-days: 14

  # Device suite. Every screen, light and dark, on an Android emulator on GitHub's machine, with round one's file names.
  # The same walk reads UiAutomator's tree (what Appium's UiAutomator2 driver reads) in every state the spec names,
  # reports each spec id seen as resource-id or why not, and taps Sign in, Clear search, Join and Check balance with the
  # keyboard up. It fails once, at the end, if anything was missed. The pictures are an artifact; docs/screenshots/
  # changes only when someone commits them.
  screenshots:
    needs: android
    if: ${{ inputs.devices }}
    runs-on: ubuntu-latest
    # the walk reads the tree in 35 states per theme, from 13 cold starts each (the Lobby's two segments are 1.1's). It
    # starts no segment after 50 minutes and waits at most 5 for a lost device, so its reports are written before this.
    timeout-minutes: 75
    outputs:
      walk: ${{ steps.walk.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: mossgrove-react-native-apk
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        timeout-minutes: 5
        with:
          node-version: "22"
      - name: Let the emulator use KVM
        timeout-minutes: 2
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The one third-party action: it starts an emulator, runs the script, and shuts the emulator down.
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        id: walk
        timeout-minutes: 65
        env:
          APK: dist/mossgrove-react-native-${{ inputs.version }}-debug.apk
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          # the runner has 4 cores and 16 GB; the action's default is 2 cores and the profile's RAM. Run 41740214045
          # lost the emulator 1 minute into the walk, and an emulator starved on API 35 is the likeliest cause.
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # The smoke start runs once after the install: it starts the app, waits 60 s for its sign-in screen and says
          # what is on screen either way. If the app does not start it says so in one line (an error annotation) and
          # the walk, which reads its smoke.json, writes its reports without running and fails. "|| true" only lets the
          # walk's line run to write them: the walk fails the step.
          script: |
            adb -s emulator-5554 install -r "$APK"
            node scripts/screenshots.mjs --smoke || true
            node scripts/screenshots.mjs
      - name: The walk and the ids, in the job summary
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: cat build/screenshots/walk.md build/screenshots/android-ids.md >> "$GITHUB_STEP_SUMMARY" || true
      # the pictures, every state's tree, the reports and, for a segment that stopped, its screen and tree (and, for a
      # lost device, what the guest logged once it was back)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        with:
          name: mossgrove-react-native-screenshots
          path: build/screenshots/
          if-no-files-found: error
          retention-days: 30

  # Every check, from each job's own outcomes, after every job whatever they found. A check is read from its job's
  # outputs, or, when the job never wrote them (skipped, or stopped before), from the job's result: a skipped check is
  # listed as skipped, never as passed. Fails the run when any check, or any job outside its checks, failed or was
  # cancelled; release.yml's github-release needs this workflow, so it publishes only after this is green.
  summary:
    name: Every check
    needs: [test, android, ios, screenshots]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every check
        timeout-minutes: 5
        env:
          CHECK_1: "Typecheck|${{ needs.test.outputs.typecheck || needs.test.result }}"
          CHECK_2: "Jest|${{ needs.test.outputs.jest || needs.test.result }}"
          CHECK_3: "expo-doctor|${{ needs.test.outputs.doctor || needs.test.result }}"
          CHECK_4: "Expo versions|${{ needs.test.outputs.versions || needs.test.result }}"
          CHECK_5: "The walk's plan|${{ needs.test.outputs.plan || needs.test.result }}"
          CHECK_6: "The .apk (Gradle)|${{ needs.android.outputs.apk || needs.android.result }}"
          CHECK_7: "The JS bundle inside the .apk|${{ needs.android.outputs.bundle || needs.android.result }}"
          CHECK_8: "The simulator .app|${{ needs.ios.outputs.app || needs.ios.result }}"
          CHECK_9: "The screenshot walk on an Android emulator|${{ needs.screenshots.outputs.walk || needs.screenshots.result }}"
          JOB_1: "test|${{ needs.test.result }}"
          JOB_2: "android|${{ needs.android.result }}"
          JOB_3: "ios|${{ needs.ios.result }}"
          JOB_4: "screenshots|${{ needs.screenshots.result }}"
        run: |
          python3 - <<'EOF'
          import os, sys

          def numbered(prefix):
              keys = [k for k in os.environ if k.startswith(prefix) and k[len(prefix):].isdigit()]
              return [os.environ[k] for k in sorted(keys, key=lambda k: int(k[len(prefix):]))]

          checks = [entry.rpartition("|")[::2] for entry in numbered("CHECK_")]
          jobs = [entry.rpartition("|")[::2] for entry in numbered("JOB_")]
          mark = {"success": "✅", "failure": "❌", "cancelled": "🚫"}
          lines = ["## Every check", "", "| Check | Outcome |", "| --- | --- |"]
          lines += [f"| {name} | {mark.get(outcome, '⏭️')} {outcome or 'not run'} |" for name, outcome in checks]
          bad = ("failure", "cancelled")
          failed = [name for name, outcome in checks if outcome in bad]
          stray = [f"{job} ({result})" for job, result in jobs if result in bad]
          if stray and not failed:
              lines += ["", "A job failed outside its checks: " + ", ".join(stray)]
          page = "\n".join(lines) + "\n"
          print(page)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(page)
          if failed or stray:
              what = f"{len(failed)} of {len(checks)} checks failed or were cancelled: {', '.join(failed)}" if failed \
                  else f"a job failed: {', '.join(stray)}"
              print(f"::error title=Checks failed::{what}")
              sys.exit(1)
          EOF
